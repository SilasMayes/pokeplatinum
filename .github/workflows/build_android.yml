name: build_android

on:
  push:
    branches: [ platinum-thor ]
    paths-ignore:
      - '**.md'
  # Pull requests get the APK as a run artifact; only pushes to platinum-thor publish a release
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build_android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_android:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Software
        # apt mirrors occasionally hang; fail fast instead of waiting hours
        timeout-minutes: 15
        run: |
          sudo apt-get update -y -o Acquire::Retries=3 -o Acquire::http::Timeout=60
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=60 \
            git python3 gcc g++ cmake ninja-build nasm flex bison libpng-dev pkg-config \
            gcc-arm-none-eabi

      - name: Checkout Repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: '8.10.2'

      - name: Fetch Meson
        run: make meson

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          # The runner's default NDK (r27, clang 18): the toolchain the code was tested with
          echo "NDK: $ANDROID_NDK_HOME"
          export VERSION_NAME="$(git rev-parse --short HEAD)"
          set -o pipefail
          ./tools/android/build_apk.sh 2>&1 | tee build.log

      # Surface the failure as annotations (readable from the run page and the checks API)
      - name: Report build errors
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          python3 - <<'PY'
          import re
          lines = open('build.log', errors='replace').read().splitlines()
          failed = [l for l in lines if l.startswith('FAILED:')]
          errors = list(dict.fromkeys(l.strip() for l in lines
                                      if re.search(r'error:|undefined (symbol|reference)|fatal|ERROR|What went wrong', l)))
          if failed:
              errors.insert(0, f'{len(failed)} failed build steps, first: {failed[0]}')
          def emit(title, chunk):
              msg = '\n'.join(chunk)[-30000:]
              msg = msg.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::error title={title}::{msg}')
          if errors:
              emit('Errors', errors[:150])
          emit('Log tail', lines[-200:])
          PY

      - name: Upload APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pokeplatinum-android
          path: android/app/build/outputs/apk/release/app-release.apk

  # A fixed download link for the newest build, so it can be grabbed straight from
  # the device's browser without signing in to GitHub or unzipping an artifact.
  # Its own job so that only this step gets write access.
  publish_latest:
    needs: build_android
    # platinum-thor in this repo only (push or manual run): never forks, pull requests or runs
    # on other branches (those still get the APK artifact above)
    if: github.repository_owner == 'SilasMayes' && github.event_name != 'pull_request' && github.ref == 'refs/heads/platinum-thor'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: pokeplatinum-android

      - name: Publish latest build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app-release.apk pokeplatinum-thor.apk
          gh release delete thor-android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create thor-android-latest pokeplatinum-thor.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Thor Android build (latest)" \
            --notes "Rolling build of ${GITHUB_SHA::8} (run ${{ github.run_number }}), replaced on every push. For a tested build use the newest numbered release. Code only: on first launch the game asks for your own Pokémon Platinum (US) ROM and extracts its files."

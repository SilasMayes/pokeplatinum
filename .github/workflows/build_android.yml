name: build_android

on:
  push:
    branches: [ thor-android ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write # the "latest build" pre-release

concurrency:
  group: build_android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_android:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Software
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            git python3 gcc g++ cmake ninja-build nasm flex bison libpng-dev pkg-config \
            gcc-arm-none-eabi

      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Fetch Meson
        run: make meson

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          # The runner's default NDK (r27, clang 18): the toolchain the code was tested with
          echo "NDK: $ANDROID_NDK_HOME"
          export VERSION_NAME="$(git rev-parse --short HEAD)"
          set -o pipefail
          ./tools/android/build_apk.sh 2>&1 | tee build.log

      # Surface the failure as annotations (readable from the run page and the checks API)
      - name: Report build errors
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          python3 - <<'PY'
          import re
          lines = open('build.log', errors='replace').read().splitlines()
          failed = [l for l in lines if l.startswith('FAILED:')]
          errors = list(dict.fromkeys(l.strip() for l in lines
                                      if re.search(r'error:|undefined (symbol|reference)|fatal|ERROR|What went wrong', l)))
          if failed:
              errors.insert(0, f'{len(failed)} failed build steps, first: {failed[0]}')
          def emit(title, chunk):
              msg = '\n'.join(chunk)[-30000:]
              msg = msg.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::error title={title}::{msg}')
          if errors:
              emit('Errors', errors[:150])
          emit('Log tail', lines[-200:])
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: pokeplatinum-android
          path: android/app/build/outputs/apk/release/app-release.apk

      # A fixed download link for the newest build, so it can be grabbed straight from
      # the device's browser without signing in to GitHub or unzipping an artifact.
      - name: Publish latest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk pokeplatinum-thor.apk
          gh release delete thor-android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create thor-android-latest pokeplatinum-thor.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Thor Android build (latest)" \
            --notes "Built from ${GITHUB_SHA::8} (run ${{ github.run_number }}). Code only: on first launch the game asks for your own Pokémon Platinum (US) ROM and extracts its files."
